<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NexHire-AI | Select Interview</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="selection-page">

    <!-- NAVBAR -->

    <nav class="selection-navbar">

        <div class="home-logo">
            NexHire<span>-AI</span>
        </div>

        <a href="dashboard.html" class="selection-logout">
            Dashboard
        </a>

    </nav>


    <!-- MAIN CONTENT -->

    <main class="selection-container">

        <div class="selection-heading">

            <p>INTERVIEW SETUP</p>

            <h1>
                Choose Your
                <span>Interview</span>
            </h1>

            <p class="selection-description">
                Select your target company and job role
                to personalize your mock interview.
            </p>

        </div>


        <!-- SELECTION CARD -->

        <div class="selection-card">

            <!-- COMPANY -->

            <div class="selection-group">

                <label for="company">
                    Select Company
                </label>

                <select id="company">

                    <option value="">
                        Choose a company
                    </option>

                    <option value="Amazon">
                        Amazon
                    </option>

                    <option value="Google">
                        Google
                    </option>

                    <option value="Microsoft">
                        Microsoft
                    </option>

                    <option value="TCS">
                        TCS
                    </option>

                    <option value="Infosys">
                        Infosys
                    </option>

                    <option value="Wipro">
                        Wipro
                    </option>

                </select>

            </div>


            <!-- JOB ROLE -->

            <div class="selection-group">

                <label for="role">
                    Select Job Role
                </label>

                <select id="role">

                    <option value="">
                        Choose a job role
                    </option>

                    <option value="Java Developer">
                        Java Developer
                    </option>

                    <option value="Software Developer">
                        Software Developer
                    </option>

                    <option value="Web Developer">
                        Web Developer
                    </option>

                    <option value="Python Developer">
                        Python Developer
                    </option>

                    <option value="Data Analyst">
                        Data Analyst
                    </option>

                </select>

            </div>


            <!-- INTERVIEW TYPE -->

            <div class="selection-group">

                <label for="type">
                    Interview Type
                </label>

                <select id="type">

                    <option value="">
                        Choose interview type
                    </option>

                    <option value="Technical">
                        Technical Interview
                    </option>

                    <option value="HR">
                        HR Interview
                    </option>

                    <option value="Mixed">
                        Technical + HR
                    </option>

                </select>

            </div>


            <!-- DIFFICULTY -->

            <div class="selection-group">

                <label for="difficulty">
                    Difficulty Level
                </label>

                <select id="difficulty">

                    <option value="">
                        Choose difficulty
                    </option>

                    <option value="Easy">
                        Easy
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="Hard">
                        Hard
                    </option>

                </select>

            </div>


            <!-- CONTINUE -->

            <a href="mock-interview.html" class="continue-btn">
                Continue to Interview →
            </a>

        </div>


        <!-- PROCESS -->

        <div class="selection-info">

            <div>

                <strong>01</strong>

                <span>
                    Choose Company
                </span>

            </div>


            <div>

                <strong>02</strong>

                <span>
                    Choose Role
                </span>

            </div>


            <div>

                <strong>03</strong>

                <span>
                    Start Interview
                </span>

            </div>

        </div>

    </main>

</div>

</body>
</html>
